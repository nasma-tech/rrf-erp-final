services:

  nginx:
    image: nginx:latest
    container_name: php-framework-v2-nginx

    ports:
      - "36401:80"

    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: php-framework-v2-php

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html

  mysql:
    image: mysql:8.4

    container_name: php-framework-v2-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: erp

    ports:
      - "36403:3306"

    volumes:
      - php-framework-v2-mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  mongodb:
    image: mongo:8

    container_name: php-framework-v2-mongodb

    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root

    ports:
      - "36407:27017"

    volumes:
      - php-framework-v2-mongodb-data:/data/db
      - ./docker/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
volumes:
  php-framework-v2-mysql-data:
  php-framework-v2-mongodb-data: